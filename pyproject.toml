[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | node_modules
  | alembic
  | scratch
  | scripts
  | archive
  | submissions
)/
'''

[tool.pyright]
include = ["backend"]
extraPaths = [
    "backend",
    "backend/venv/Lib/site-packages"
]
venvPath = "backend"
venv = "venv"

