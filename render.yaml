services:
  # -------------------------------------------------------------
  # React Frontend Static Site on Render (Connected to Vercel Backend)
  # -------------------------------------------------------------
  - type: web
    name: internship-portal-frontend
    env: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE
        sync: false
      - key: REACT_APP_EMAILJS_SERVICE_ID
        sync: false
      - key: REACT_APP_EMAILJS_TEMPLATE_ID
        sync: false
      - key: REACT_APP_EMAILJS_PUBLIC_KEY
        sync: false
